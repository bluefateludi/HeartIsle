<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6ee" />
    <title>陪我开始 · 心屿</title>
    <style>
      :root {
        --paper: #f8f6ee;
        --ink: #343f35;
        --green: #52664c;
        --muted: #72776b;
        --line: #dedfd2;
        --serif: "Songti SC", "STSong", SimSun, serif;
        --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
      ::selection {
        background: #dce2cb;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 4px;
      }
      button:disabled {
        cursor: default;
      }
      .shell {
        width: min(1080px, calc(100% - 80px));
        margin: auto;
      }
      header {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font: 24px var(--serif);
        letter-spacing: 3px;
      }
      .mark {
        border: 1px solid #7b8a69;
        border-radius: 50% 50% 40% 40%;
        padding: 7px;
        font-size: 19px;
        transform: rotate(-5deg);
      }
      .brand small {
        display: block;
        font:
          9px Georgia,
          serif;
        letter-spacing: 2px;
        margin-top: 5px;
      }
      .back {
        font-size: 12px;
        color: var(--green);
      }
      main {
        display: grid;
        grid-template-columns: 0.7fr 1.3fr;
        gap: 60px;
        padding: 60px 0 48px;
        min-height: calc(100vh - 240px);
      }
      .intro {
        padding-top: 28px;
      }
      .eyebrow {
        font:
          10px Georgia,
          serif;
        letter-spacing: 2.5px;
        color: var(--green);
        margin: 0 0 25px;
      }
      h1 {
        font: 500 clamp(34px, 4vw, 46px)/1.65 var(--serif);
        letter-spacing: 3px;
        margin: 0 0 22px;
      }
      .intro p {
        font-size: 14px;
        line-height: 2;
        color: var(--muted);
      }
      .intro .small-note {
        font-size: 11px;
        line-height: 1.9;
        margin-top: 22px;
      }
      .landscape {
        height: 165px;
        margin: 36px 0 0;
        border-radius: 100px 100px 8px 8px;
        background: url("./images/flower-field.jpg") center 60% / cover;
        max-width: 300px;
      }
      .landscape + span {
        display: block;
        font: 12px var(--serif);
        letter-spacing: 2px;
        color: var(--muted);
        margin-top: 13px;
      }
      .workspace {
        min-width: 0;
        align-self: start;
        background: #fffdf8;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 16px 50px #343f3505;
      }
      .panel {
        padding: 30px;
      }
      h2 {
        font: 500 25px/1.6 var(--serif);
        margin: 0 0 10px;
        letter-spacing: 1px;
      }
      h3 {
        font: 500 21px/1.6 var(--serif);
        margin: 0 0 14px;
      }
      .description,
      .goal {
        font-size: 13px;
        line-height: 1.9;
        color: var(--muted);
        margin: 0 0 20px;
        overflow-wrap: anywhere;
      }
      label {
        display: block;
        font-size: 12px;
        line-height: 1.8;
        margin-bottom: 10px;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 14px;
        background: #fcfbf6;
        color: var(--ink);
        line-height: 1.9;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
        font-size: 14px;
      }
      textarea::placeholder,
      input::placeholder {
        color: #8b9084;
      }
      .input-meta {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        margin: 9px 0 21px;
      }
      .examples,
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .examples {
        margin: 12px 0 26px;
      }
      .chip,
      .secondary {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--green);
        padding: 10px 14px;
        font-size: 12px;
      }
      .chip:hover,
      .secondary:hover {
        background: #f1f2e8;
      }
      .primary {
        background: var(--green);
        color: #fffdf8;
        border: 1px solid var(--green);
        border-radius: 7px;
        padding: 13px 18px;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .wide {
        width: 100%;
      }
      .primary span {
        float: right;
      }
      .primary:hover {
        background: #40533b;
      }
      .quiet {
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 12px;
        padding: 12px 0;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .extras {
        margin: 0 0 23px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 15px;
      }
      summary {
        cursor: pointer;
        color: var(--green);
        font-size: 12px;
        padding: 8px 0;
      }
      .choices {
        display: grid;
        gap: 9px;
        margin: 16px 0;
      }
      .choice {
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffdf8;
        padding: 15px;
        color: var(--ink);
        font-size: 13px;
      }
      .choice[aria-pressed="true"] {
        background: #edf1e6;
        border-color: #748865;
        box-shadow: inset 3px 0 #748865;
      }
      .list-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 15px;
      }
      #progress {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .invitation {
        font-size: 12px;
        color: var(--green);
        padding: 13px 15px;
        background: #f0f2e8;
        border-radius: 6px;
        margin: 0 0 23px;
      }
      .task-list,
      .task-children {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .task-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fffdf8;
      }
      .task-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 13px;
      }
      .task-row input[type="checkbox"] {
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        margin: 4px 0 0;
        accent-color: var(--green);
        cursor: pointer;
      }
      .task-row input:disabled {
        cursor: default;
      }
      .task-select {
        min-width: 0;
        flex: 1;
        text-align: left;
        font-size: 14px;
        line-height: 1.9;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .stuck-button {
        flex: 0 0 auto;
        align-self: center;
        background: transparent;
        border: 0;
        color: var(--green);
        font-size: 11px;
        padding: 5px 0;
      }
      .task-item.selected {
        border-color: #708460;
        background: #f0f3e9;
        box-shadow: inset 3px 0 #708460;
      }
      .task-item.complete > .task-row .task-select {
        color: var(--muted);
        text-decoration: line-through;
      }
      .task-children {
        margin: 0 10px 10px 18px;
        padding-left: 10px;
        border-left: 1px solid #cbd4c0;
      }
      .step-editor {
        padding: 2px 17px 18px 42px;
      }
      .editing-label {
        font-size: 11px;
        color: var(--green);
        line-height: 1.8;
        overflow-wrap: anywhere;
        margin: 0 0 14px;
      }
      .step-editor .description {
        margin-bottom: 12px;
        font-size: 12px;
      }
      .step-editor textarea {
        background: #fffdf8;
      }
      .draft-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .draft-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .draft-number {
        flex: 0 0 18px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .draft-row input[type="text"] {
        min-width: 0;
        flex: 1;
        background: #fffdf8;
        padding: 10px;
        font-size: 13px;
      }
      .remove-task {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 10px 2px;
        font-size: 11px;
        flex-shrink: 0;
      }
      .remove-task:hover {
        color: #9a503c;
      }
      .add-task {
        border: 1px dashed #a8b498;
        border-radius: 6px;
        padding: 11px;
        width: 100%;
        background: transparent;
        color: var(--green);
        font-size: 12px;
      }
      .add-task:hover {
        background: #e7eddc;
      }
      .step-editor .actions {
        margin-top: 14px;
      }
      .help-response {
        font-size: 12px;
        line-height: 1.9;
        margin-bottom: 0;
      }
      .status {
        min-height: 18px;
        font-size: 12px;
        color: var(--green);
        line-height: 1.8;
        margin: 12px 0 0;
      }
      .error {
        color: #9a503c;
      }
      .finished {
        font: 18px/1.8 var(--serif);
        color: var(--green);
        padding: 20px 0;
      }
      .resume-button {
        margin-bottom: 22px;
      }
      #clarify-form .actions {
        margin-top: 15px;
      }
      .save-bar {
        position: sticky;
        bottom: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 13px 20px;
        background: #fffdf8f5;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 5px 25px #343f3510;
      }
      #save-status {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .save-bar .secondary {
        min-width: 90px;
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 23px 0;
        margin-top: 25px !important;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }
      .skip {
        position: absolute;
        left: 15px;
        top: -100px;
      }
      .skip:focus {
        top: 10px;
        background: var(--paper);
        padding: 10px;
        z-index: 3;
      }
      @media (max-width: 760px) {
        .shell {
          width: calc(100% - 32px);
        }
        header {
          height: 82px;
        }
        main {
          grid-template-columns: 1fr;
          gap: 25px;
          padding: 30px 0;
        }
        .intro {
          padding: 0;
        }
        .eyebrow {
          margin-bottom: 14px;
        }
        h1 {
          font-size: 32px;
          line-height: 1.5;
          margin-bottom: 12px;
        }
        h1 br {
          display: none;
        }
        .intro p {
          font-size: 13px;
          margin-bottom: 0;
        }
        .landscape,
        .landscape + span,
        .intro .small-note {
          display: none;
        }
        .panel {
          padding: 20px;
        }
        h2 {
          font-size: 23px;
        }
        .list-heading {
          flex-wrap: wrap;
          gap: 0;
        }
        #progress {
          margin-bottom: 12px;
        }
        .task-row {
          padding: 12px 10px;
          gap: 8px;
        }
        .task-select {
          font-size: 13px;
        }
        .step-editor {
          padding: 0 12px 16px;
        }
        .task-children {
          margin-left: 10px;
          padding-left: 6px;
        }
        footer {
          gap: 15px;
          line-height: 1.8;
        }
        .save-bar {
          bottom: 8px;
          padding: 10px 14px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <header class="shell">
      <a class="brand" href="./"
        ><span class="mark" aria-hidden="true">屿</span
        ><span>心屿<small lang="en">HEART ISLE</small></span></a
      ><a class="back" href="./">回到心屿 ↗</a>
    </header>
    <main id="main" class="shell">
      <aside class="intro">
        <p class="eyebrow" lang="en">ONE SMALL BEGINNING</p>
        <h1>先迈出，<br />很小的一步。</h1>
        <p>与其先拯救世界，不如先开始五分钟。</p>
        <div class="landscape" role="img" aria-label="阳光下的花海"></div>
        <span>按自己的节奏，慢慢来。</span>
        <p class="small-note">
          可以从一句没整理好的话开始。<br />今天愿意做多少，就先做多少。
        </p>
      </aside>
      <section class="workspace" aria-label="陪我开始">
        <section class="panel" id="input-panel" aria-labelledby="input-title">
          <h2 id="input-title" tabindex="-1">今天，想从什么开始？</h2>
          <p class="description">
            要做的大事、挂在心里的小事，都可以写在这里。
          </p>
          <button class="secondary resume-button" id="resume" hidden>
            回到暂存的清单 →
          </button>
          <form id="task-form">
            <details class="extras">
              <summary>说说现在的状态 · 可选</summary>
              <div class="choices" aria-label="现在的状态">
                <button
                  type="button"
                  class="choice"
                  data-mood="energy"
                  aria-pressed="false"
                >
                  没什么力气，希望轻一点
                </button>
                <button
                  type="button"
                  class="choice"
                  data-mood="overwhelmed"
                  aria-pressed="false"
                >
                  脑子很乱，事情挤在一起
                </button>
                <button
                  type="button"
                  class="choice"
                  data-mood="fear"
                  aria-pressed="false"
                >
                  有件事想做，但一直启动不了
                </button>
                <button
                  type="button"
                  class="choice"
                  data-mood="ready"
                  aria-pressed="false"
                >
                  可以做一点，帮我找个起点
                </button>
              </div>
            </details>
            <label for="task">我想推进的事情</label
            ><textarea
              id="task"
              maxlength="1000"
              required
              placeholder="比如，今天要写方案，但一想到就头大。或者，只是感觉有好多事情，想先理一理……"
            ></textarea>
            <div class="input-meta">
              <span>写一句话也可以</span><span id="count">0 / 1000</span>
            </div>
            <div class="examples">
              <button
                class="chip"
                type="button"
                data-example="今天要写方案，一想到就头大。"
              >
                写方案</button
              ><button
                class="chip"
                type="button"
                data-example="房间很乱，不知道从哪里开始收拾。"
              >
                收拾房间</button
              ><button
                class="chip"
                type="button"
                data-example="感觉有好多事该做，但还没想清楚要做什么。"
              >
                还没想清楚
              </button>
            </div>
            <button class="primary wide" type="submit">
              帮我找一个开始 <span aria-hidden="true">↗</span>
            </button>
            <p class="status error" id="input-error" role="status"></p>
          </form>
        </section>
        <section
          class="panel"
          id="tasks-panel"
          aria-labelledby="tasks-title"
          hidden
        >
          <div class="list-heading">
            <h2 id="tasks-title" tabindex="-1">从一件小事开始。</h2>
            <span id="progress"></span>
          </div>
          <p class="goal" id="goal-summary"></p>
          <p class="invitation">先试着做五分钟，做多少都可以。</p>
          <form id="clarify-form" hidden>
            <label for="clarification">此刻最挂心的一件事是什么？</label>
            <input
              id="clarification"
              type="text"
              maxlength="1000"
              placeholder="比如，回复昨天的邮件"
            />
            <div class="actions">
              <button class="secondary" type="button" data-save>暂存</button
              ><button class="primary" type="submit">就从这件事开始</button>
            </div>
            <p class="status error" id="clarify-error" role="status"></p>
          </form>
          <div id="task-tree"></div>
          <p id="all-done" class="finished" hidden>
            这一轮完成了。每一小步，都算数。
          </p>
          <p id="task-status" class="status" role="status"></p>
          <button class="quiet" id="back-input">回到输入</button>
        </section>
        <noscript
          ><p class="panel">
            请启用 JavaScript 来使用任务拆解和进度保存功能。
          </p></noscript
        >
      </section>
    </main>
    <div class="save-bar shell" aria-label="暂存操作">
      <span id="save-status" role="status">随时暂存，回来接着做。</span
      ><button class="secondary" data-save type="button">暂存</button>
    </div>
    <footer class="shell">
      <span>心屿 · 陪我开始</span><span>给每一个小小的开始，留一点空间。</span>
    </footer>
    <script src="./start.js" type="module"></script>
  </body>
</html>
